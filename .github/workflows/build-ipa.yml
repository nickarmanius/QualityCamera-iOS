name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: |
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build and Archive
      run: |
        xcodebuild -project QualityCamera.xcodeproj \
                   -scheme QualityCamera \
                   -sdk iphoneos \
                   -configuration Release \
                   -archivePath build/QualityCamera.xcarchive \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED="NO" \
                   CODE_SIGNING_ALLOWED="NO" \
                   archive

    - name: Export IPA
      run: |
        mkdir -p build/Payload
        # Automatically copy whichever app bundle was generated inside the archive
        cp -r build/QualityCamera.xcarchive/Products/Applications/*.app build/Payload/
        cd build
        zip -r QualityCamera.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QualityCamera-IPA
        path: build/QualityCamera.ipa